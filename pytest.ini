[tool:pytest]
# Pytest configuration for AI Video Editor comprehensive testing

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Coverage settings
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=backend
    --cov=coordinator
    --cov=workers
    --cov=utils
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - test component interactions
    e2e: End-to-end tests - test complete workflows
    api: API endpoint tests
    websocket: WebSocket functionality tests
    performance: Performance and load tests
    slow: Tests that take longer than 5 seconds
    external: Tests that require external dependencies
    cleanup: Tests for cleanup functionality
    workflow: Workflow orchestrator tests
    session: Session management tests

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::RuntimeWarning

# Minimum version requirements
minversion = 6.0

# Test timeout (prevent hanging tests)
timeout = 300

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] (%(name)s) %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Parallel execution (when pytest-xdist is installed)
# Can be overridden with -n flag
# addopts = -n auto

# JUnit XML output for CI/CD
# addopts = --junitxml=test-results.xml
